soc0:
  type: soc
  compatible: ti,lm3s6965

clock0:
  type: clock
  compatible: micros,clock
  frequency: 50000000
  status: "okay"


console0:
  type: console
  compatible: micros,console
  serial: uart0
  baudrate: 115200
  status: "okay"

oled0:
  type: display
  compatible: ritdisplay,rgs13128096wh000-spi
  bus: spi0
  cs-gpio-port: gpioa
  cs-gpio-pin: 3
  dc-gpio-port: gpioc
  dc-gpio-pin: 7
  width: 128
  height: 96
  rotation: 0
  status: "okay"

button_select:
  type: gpio-button
  compatible: gpio-keys
  gpio_port: gpiof
  gpio_pin: 1
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "User Button"
  linux,code: 116
  status: "okay"

button_up:
  type: gpio-button
  compatible: gpio-keys
  gpio_port: gpioe
  gpio_pin: 0
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "Up Button"
  linux,code: 103
  status: "okay"

button_down:
  type: gpio-button
  compatible: gpio-keys
  gpio_port: gpioe
  gpio_pin: 1
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "Down Button"
  linux,code: 108
  status: "okay"

button_left:
  type: gpio-button
  compatible: gpio-keys
  gpio_port: gpioe
  gpio_pin: 2
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "Left Button"
  linux,code: 105
  status: "okay"

button_right:
  type: gpio-button
  compatible: gpio-keys
  gpio_port: gpioe
  gpio_pin: 3
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "Right Button"
  linux,code: 106
  status: "okay"

led0:
  type: gpio-led
  compatible: gpio-leds
  gpio_port: gpiof
  gpio_pin: 0
  gpio_flags: "active_low"