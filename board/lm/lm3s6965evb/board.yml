soc0:
  type: soc
  compatible: ti,lm3s6965

clock0:
  type: clock
  compatible: micros,clock
  frequency: 50000000
  enabled: true


console0:
  type: console
  compatible: micros,uart-console
  serial: uart0
  baudrate: 115200
  enabled: true

oled0:
  type: display
  compatible: ritdisplay,rgs13128096wh000-spi
  bus: spi0
  cs-gpio-port: gpioa
  cs-gpio-pin: 3
  dc-gpio-port: gpioc
  dc-gpio-pin: 7
  width: 128
  height: 96
  rotation: 0
  enabled: true

button_select:
  type: button
  compatible: micros,gpio-button
  gpio_port: gpiof
  gpio_pin: 1
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "User Button"
  code: 116
  enabled: true

button_up:
  type: button
  compatible: micros,gpio-button
  gpio_port: gpioe
  gpio_pin: 0
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "Up Button"
  code: 103
  enabled: true

button_down:
  type: button
  compatible: micros,gpio-button
  gpio_port: gpioe
  gpio_pin: 1
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "Down Button"
  code: 108  
  enabled: true


button_left:
  type: button
  compatible: micros,gpio-button
  gpio_port: gpioe
  gpio_pin: 2
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "Left Button"
  code: 105
  enabled: true

button_right:
  type: button
  compatible: micros,gpio-button
  gpio_port: gpioe
  gpio_pin: 3
  gpio_flags: "active_low"
  debounce-interval: 100
  label: "Right Button"
  code: 106
  enabled: true

led0:
  type: led
  compatible: micros,gpio-led
  gpio_port: gpiof
  gpio_pin: 0
  gpio_flags: "active_low"
  enabled: true