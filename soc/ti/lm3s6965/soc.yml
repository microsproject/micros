arch0: 
  type: arch
  compatible: arm,cortex_m3

ram0: 
  type: memory
  compatible: micros,generic-memory
  base: 0x20000000
  size: 0x00010000

flash0: 
  type: memory
  compatible: micros,generic-memory
  exec: true
  base: 0x00000000
  size: 0x00080000

ctrl0:
  type: system-controller
  compatible: ti,sysctl

flash_ctrl0:
  type: flash-controller
  compatible: ti,lm3s-flash
  base: 0x400fd000
  size: 0x1000

gpioa:
  type: gpio
  compatible: ti,lm3s-gpio
  base: 0x40004000
  size: 0x1000
  interrupts: [0]
  status: "okay"

gpiob:
  type: gpio
  compatible: ti,lm3s-gpio
  base: 0x40005000
  size: 0x1000
  interrupts: [0]
  status: "okay"

gpioc:
  type: gpio
  compatible: ti,lm3s-gpio
  base: 0x40006000
  size: 0x1000
  interrupts: [0]
  status: "okay"

gpiod:
  type: gpio
  compatible: ti,lm3s-gpio
  base: 0x40007000
  size: 0x1000
  interrupts: [0]
  status: "okay"

gpioe:
  type: gpio
  compatible: ti,lm3s-gpio
  base: 0x40024000
  size: 0x1000
  interrupts: [0]
  status: "okay"

gpiof:
  type: gpio
  compatible: ti,lm3s-gpio
  base: 0x40025000
  size: 0x1000
  interrupts: [0]
  status: "okay"

gpiog:
  type: gpio
  compatible: ti,lm3s-gpio
  base: 0x40026000
  size: 0x1000
  interrupts: [0]
  status: "okay"

